# Publishes @makerportal/mcp to npm WITH PROVENANCE.
#
# ── WHY THIS WORKFLOW LIVES HERE AND NOT IN THE MONOREPO ────────────────────
# npm provenance requires that the publishing workflow live in the repository
# the manifest's `repository` field names, and that the repository be public.
# The package was previously inside a private monorepo, so provenance was
# impossible and a `repository` field would have rendered a link that 404s for
# every visitor — worse than absent on a package whose whole argument is "it is
# seven small files, go read them".
#
# `--provenance` produces a signed attestation binding this tarball to this
# commit and this workflow run. For a package an AGENT executes, that is the
# strongest trust signal available, and it cannot be retrofitted later.
#
# ── PUBLISHING POSTURE: DONE. NOTHING HERE NEEDS SETTING UP AGAIN. ──────────
#
# Settled 2026-09-04 (D-391 in the makerportal-hub estate). This package is
# published and can be published ONLY by this workflow file, running in the
# `npm-publish` environment, on this repository. There is no token anywhere in
# the path — not in a secret, not in an env block, not on a laptop.
#
#   · npm 2FA is ON at `auth-and-writes`.
#   · Package Settings -> Publishing access -> "Require two-factor
#     authentication and disallow bypass 2fa tokens". (The label is "disallow
#     BYPASS 2FA tokens", not "disallow tokens" — earlier docs had it wrong.)
#     npm states all publishing-access options are compatible with trusted
#     publishers, and that is now observed, not assumed.
#   · Trusted publisher configured: GitHub Actions / `makerportal` / `mcp` /
#     `publish.yml` / env `npm-publish`, allowing `npm publish` AND
#     `npm stage publish`. THE CONNECTION IS IMMUTABLE — npm's form says the
#     provider and required fields "cannot be changed later"; to change them you
#     delete it and create a new one.
#   · The `npm-publish` environment exists with the owner as required reviewer
#     and Prevent-self-review OFF (solo owner, or nobody can approve). A
#     workflow `environment:` reference CREATES NOTHING — if that environment is
#     ever deleted, this gate silently stops existing.
#   · Both granular tokens are revoked and the `NPM_TOKEN` repo secret is
#     deleted. The repository has zero secrets. That is the intended state.
#
# ── WHY `npm publish` IS ALLOWED AND NOT STAGING-ONLY ──────────────────────
# npm's form warns "Not recommended. For stronger security, leave unchecked to
# allow staged publishing only." Direct publish was allowed deliberately: this
# workflow runs `npm publish`, so staging-only would fail the run for a reason
# unrelated to OIDC. The compensating control sits EARLIER in the chain — the
# `npm-publish` environment's required reviewer gates every dispatch before any
# credential is minted. Moving to staging-only is available at the cost of
# delete-and-recreate plus changing the command below.
#
# ── IF YOU ARE HERE BECAUSE A PUBLISH WENT RED ─────────────────────────────
#
#  1. READ WHICH STEP FAILED before concluding anything about OIDC. On
#     2026-09-04 run 33916613232 went red at the boundary gate with
#     `npm publish` SKIPPED — it measured nothing about trusted publishing in
#     either direction and cost an owner approval. `server.json` had been left
#     at the old version while `package.json` moved. Run `node --test
#     boundary.test.mjs` and `node --test bridge.test.mjs` LOCALLY on the exact
#     ref first; a gated run is too expensive to spend on a local failure.
#  2. **DO NOT RE-ADD A TOKEN TO "FIX" A RED PUBLISH STEP.** A failure there is
#     the misconfiguration detector working. Fix the trust config (delete and
#     recreate) and re-dispatch.
#  3. `ENEEDAUTH` means the npm on the runner is < 11.5.1. Measured on
#     2026-09-04: `npm install -g npm@^11.15.0` yielded **11.19.1** on Node
#     **v22.23.2**, both above the floors (npm 11.5.1, Node 22.14.0). The
#     `npm --version` line below is that measurement, left in the log on
#     purpose.
#  4. A GREEN RUN IS NOT PROOF, and neither is a sigstore log entry. The
#     registry and a clean-temp-dir install are the oracles. Expect the
#     registry to LAG: the OIDC publish printed "Your package is being
#     processed and may take a few minutes to become available" and took
#     **2 min 08 s** to appear, where the token publish took 4 s and printed no
#     such line. Absence at t+0 is not absence — poll to a transition before
#     reporting a problem.
#  5. `setup-node` with `registry-url` exports a placeholder
#     `NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX`. That is expected and appears
#     in npm's own trusted-publishing example. It is not a leaked secret and it
#     is not what authenticates the publish.
#
# ── THE ONE THING THAT CANNOT BE REDONE ────────────────────────────────────
# The first publish of a package cannot use OIDC (npm/cli#8544, still open).
# That bootstrap is spent. If this package is ever unpublished and recreated,
# the whole bootstrap-token dance in D-390/D-391 has to happen again.
#
name: Publish
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version to publish. Must equal package.json exactly — this is the guard against publishing something other than what you reviewed."
        required: true
permissions:
  contents: read
  id-token: write        # required for provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing needs npm ≥ 11.5.1 (11.15.0 for `npm trust`);
      # the npm bundled with Node 22 is 10.x. The printed version is the
      # measurement this run leaves in the log.
      - run: npm install -g npm@^11.15.0 && npm --version
      - run: npm ci
      # The gates run BEFORE the publish, not after. A tarball is not
      # unpublishable once it is out.
      - name: Version guard
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${{ inputs.package_version }}" ]; then
            echo "package.json says $declared, you asked for ${{ inputs.package_version }}" >&2
            exit 1
          fi
      - run: node --test bridge.test.mjs
      - name: Boundary gate — no solver source may ship
        run: node --test boundary.test.mjs
      # OIDC only — deliberately NO NODE_AUTH_TOKEN here. npm ≥ 11.5.1 detects
      # the Actions OIDC environment (id-token: write) and exchanges it for a
      # short-lived publish credential bound to this repo, workflow file and
      # environment. If the trusted publisher is misconfigured this fails —
      # that is the verification; do not re-add the token to "fix" it.
      - run: npm publish --provenance --access public
