# Publishes @makerportal/mcp to npm WITH PROVENANCE.
#
# ── WHY THIS WORKFLOW LIVES HERE AND NOT IN THE MONOREPO ────────────────────
# npm provenance requires that the publishing workflow live in the repository
# the manifest's `repository` field names, and that the repository be public.
# The package was previously inside a private monorepo, so provenance was
# impossible and a `repository` field would have rendered a link that 404s for
# every visitor — worse than absent on a package whose whole argument is "it is
# seven small files, go read them".
#
# `--provenance` produces a signed attestation binding this tarball to this
# commit and this workflow run. For a package an AGENT executes, that is the
# strongest trust signal available, and it cannot be retrofitted later.
#
# ── SETUP THE OWNER MUST DO ONCE ────────────────────────────────────────────
#   1. npm 2FA: `npm profile enable-2fa auth-and-writes` (stays ON forever).
#   2. OIDC TRUSTED PUBLISHING (adopted 2026-09-04, D-389) — no long-lived
#      write token. On npmjs.com, package settings → Trusted Publisher →
#      GitHub Actions: user `makerportal`, repo `mcp`, workflow `publish.yml`,
#      environment `npm-publish`, allow `npm publish`. Provenance is automatic
#      on this path; the `--provenance` flag below is harmless if kept.
#      OPEN QUESTION as of D-389: the docs assume the package already exists
#      ("navigate to your package settings") and @makerportal/mcp does not yet
#      (registry 404). If npmjs.com refuses trust for an unborn package, first
#      publish goes by the fallback token and trust is configured right after.
#      Record which branch happened; do not assume.
#   3. FALLBACK token (only until OIDC verifies, then revoke): a GRANULAR token
#      scoped to the @makerportal scope (pre-publish the picker offers ONLY the
#      scope — the package does not exist to pin; never "All packages", never
#      Classic), no orgs, no IP ranges, WITH "Bypass two-factor authentication"
#      CHECKED. Unchecked (the default) fails CI with EOTP *after* provenance
#      is signed (run 33902417578): attestation logged, registry 404. The Bypass
#      screen warns toward trusted publishing instead — correct, see (2).
#      Store as repo secret NPM_TOKEN; the publish step below is its only reader.
#   4. CREATE the `npm-publish` environment by hand (exact lowercase name) —
#      a workflow `environment:` reference creates nothing, so until this
#      exists the required-reviewer gate silently does not exist. Required
#      reviewer: the owner. Solo owner: Prevent-self-review stays OFF or nobody
#      can approve. No environment secrets needed. Also requires npm CLI ≥
#      11.5.1 for OIDC: verify what setup-node + Node 22 yields (docs example
#      pins Node 24); GitHub-hosted runners only; repository.url must exactly
#      match this repo.
name: Publish
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version to publish. Must equal package.json exactly — this is the guard against publishing something other than what you reviewed."
        required: true
permissions:
  contents: read
  id-token: write        # required for provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The gates run BEFORE the publish, not after. A tarball is not
      # unpublishable once it is out.
      - name: Version guard
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "${{ inputs.package_version }}" ]; then
            echo "package.json says $declared, you asked for ${{ inputs.package_version }}" >&2
            exit 1
          fi
      - run: node --test bridge.test.mjs
      - name: Boundary gate — no solver source may ship
        run: node --test boundary.test.mjs
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
